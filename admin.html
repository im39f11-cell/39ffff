<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الطلبات | 39F</title><style>body{margin:0;background:#090806;color:#f4ecda;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.head{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.logo{font-size:30px;color:#e4c16b;font-weight:900;letter-spacing:3px}input,button,select{background:#18150e;border:1px solid #544628;color:#f8e9bf;border-radius:9px;padding:11px}button{cursor:pointer;background:#d8b55e;color:#171209;font-weight:bold}.notice{color:#bcb29e;line-height:1.8}.tablewrap{overflow:auto;margin-top:20px}table{border-collapse:collapse;width:100%;min-width:800px}th,td{padding:12px;border-bottom:1px solid #39301f;text-align:right;vertical-align:top}th{color:#e4c16b}.card{background:#14120d;border:1px solid #39301f;border-radius:16px;padding:18px;margin-top:20px}.error{color:#ff9b91}</style></head><body><main class="wrap"><div class="head"><div><div class="logo">39F</div><h1>لوحة الطلبات</h1></div><div><input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="off"><button id="load">عرض الطلبات</button></div></div><p class="notice">أدخل رمز الإدارة الموجود في إعدادات الخادم. لا تشارك هذا الرمز مع العملاء. هذه الصفحة لا تحفظه بعد إغلاق التبويب.</p><p id="message" class="notice"></p><section class="tablewrap"><table><thead><tr><th>الطلب</th><th>العميل</th><th>المنتجات</th><th>الإجمالي</th><th>الدفع / الحالة</th><th>تعديل الحالة</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const token=document.getElementById('token'),rows=document.getElementById('rows'),message=document.getElementById('message');const money=n=>new Intl.NumberFormat('ar-SA').format(n)+' ر.س';async function load(){message.textContent='جارٍ التحميل…';rows.innerHTML='';try{const r=await fetch('/api/admin/orders',{headers:{'x-admin-token':token.value}}),d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تحميل الطلبات');for(const o of d){const tr=document.createElement('tr');const products=(o.items||[]).map(i=>`${esc(i.name)} × ${esc(i.quantity)}`).join('<br>');tr.innerHTML=`<td><b>${esc(o.order_number)}</b><br><small>${esc(o.created_at)}</small></td><td>${esc(o.customer_name)}<br>${esc(o.customer_phone)}<br>${esc(o.customer_email||'')}</td><td>${products}</td><td>${money(o.total_sar)}</td><td>${esc(o.payment_method)}<br><b>${esc(o.status)}</b><br>${esc(o.paylink_transaction_no||'')}</td><td><select aria-label="حالة الطلب" data-order="${esc(o.order_number)}"><option value="awaiting_bank_transfer">بانتظار التحويل</option><option value="payment_pending">بانتظار الدفع</option><option value="paid">مدفوع</option><option value="processing">قيد التنفيذ</option><option value="completed">مكتمل</option><option value="cancelled">ملغي</option><option value="refunded">مسترجع</option></select> <button data-save="${esc(o.order_number)}">حفظ</button></td>`;rows.appendChild(tr);tr.querySelector('select').value=o.status;}message.textContent=`تم تحميل ${d.length} طلبًا.`;}catch(e){message.textContent=e.message;message.className='notice error'}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('load').onclick=load;rows.addEventListener('click',async e=>{const b=e.target.closest('button[data-save]');if(!b)return;const sel=rows.querySelector(`select[data-order="${CSS.escape(b.dataset.save)}"]`);try{const r=await fetch('/api/admin/orders/'+encodeURIComponent(b.dataset.save)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-token':token.value},body:JSON.stringify({status:sel.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر الحفظ');message.textContent='تم تحديث الطلب '+d.orderNumber; }catch(e){message.textContent=e.message;message.className='notice error'}});</script></body></html>
