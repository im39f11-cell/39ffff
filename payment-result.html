<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حالة الطلب | 39F</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090806;color:#f7f0df;font-family:Tahoma,Arial,sans-serif}.box{width:min(560px,calc(100% - 36px));padding:34px;border:1px solid #9d7e37;border-radius:22px;background:#14120d;box-sizing:border-box;text-align:center}.logo{font-size:38px;font-weight:900;color:#e4c16b;letter-spacing:4px}.muted{color:#bcb29e;line-height:1.9}.status{font-size:22px;margin:20px 0;color:#e4c16b}.btn{display:inline-block;padding:12px 20px;background:#d8b55e;color:#171209;text-decoration:none;border-radius:10px;font-weight:bold;margin-top:12px}</style></head><body><main class="box"><div class="logo">39F</div><div class="status" id="status">جارٍ التحقق من حالة الطلب…</div><p class="muted" id="detail">يرجى الانتظار قليلًا، لا تعتمد على صفحة الرجوع وحدها لإثبات الدفع.</p><p class="muted" id="order"></p><a class="btn" href="/">العودة للمتجر</a></main><script>const q=new URLSearchParams(location.search),s=q.get('status'),o=q.get('orderNumber');const map={paid:['تم تأكيد الدفع','تم التحقق من حالة الدفع عبر بوابة الدفع.'],payment_pending:['الدفع قيد التحقق','لم يؤكد النظام استلام المبلغ حتى الآن.'],payment_cancelled:['تم إلغاء عملية الدفع','لم يتم تأكيد الدفع. يمكنك العودة للمتجر والمحاولة مجددًا.'],cancelled:['تم إلغاء الدفع','لم يتم تأكيد الدفع.'],verification_pending:['بانتظار التحقق','تعذر التحقق الفوري من بوابة الدفع. تواصل مع المتجر قبل إعادة الدفع.'],unknown:['تعذر العثور على الطلب','تحقق من رقم الطلب أو تواصل مع المتجر.']};const d=map[s]||map.payment_pending;document.getElementById('status').textContent=d[0];document.getElementById('detail').textContent=d[1];document.getElementById('order').textContent=o?'رقم الطلب: '+o:'';</script></body></html>
